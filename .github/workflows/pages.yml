# GitHub Pages 배포. main 에 푸시하면 정적으로 내보내 올린다.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # 저장소 이름 아래 경로(/soyeong-portfolio)로 서비스되므로 basePath 를 넣는다. 커스텀 도메인을 붙이면 비운다
      - run: npm run build
        env:
          NEXT_PUBLIC_BASE_PATH: /soyeong-portfolio
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
